services:
  - type: web
    name: caderninho-digital-api
    runtime: docker
    plan: free
    region: virginia
    dockerContext: ./springBoot
    dockerfilePath: ./springBoot/Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: SPRING_FLYWAY_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: AI_MAX_PERIOD_DAYS
        value: "366"
      - key: AI_MAX_CONTEXT_ITEMS
        value: "200"
      - key: AI_MAX_CONTEXT_STRING_CHARACTERS
        value: "4000"
      - key: AI_MAX_PROVIDER_MESSAGES
        value: "40"
      - key: AI_MAX_PROVIDER_PAYLOAD_CHARACTERS
        value: "30000"
      - key: AI_FEATURE_ORCHESTRATOR
        value: "true"
      - key: AI_FEATURE_TOOLS
        value: "true"
      - key: AI_FEATURE_SEARCH
        value: "false"
      - key: AI_FEATURE_CHARTS
        value: "false"
      - key: AI_FEATURE_WRITES
        value: "false"
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        value: docevocida12@gmail.com
      - key: APP_CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:5173,https://caderninhodigital.vercel.app,https://caderninho-digital-api.onrender.com
