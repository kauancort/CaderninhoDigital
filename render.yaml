services:
  - type: web
    name: caderninho-digital-api
    runtime: docker
    plan: free
    region: virginia
    dockerContext: ./springBoot
    dockerfilePath: ./springBoot/Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: SPRING_FLYWAY_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it:free
      - key: OPENROUTER_FALLBACK_MODEL
        value: openai/gpt-oss-20b:free
      - key: TAVILY_API_KEY
        sync: false
      - key: TAVILY_API_URL
        value: https://api.tavily.com/search
      - key: TAVILY_TIMEOUT_MS
        value: "35000"
      - key: TAVILY_MAX_RESULTS
        value: "3"
      - key: AI_SEARCH_DEFAULT_CITY
        value: Marília
      - key: AI_SEARCH_DEFAULT_STATE
        value: SP
      - key: APP_TIME_ZONE
        value: America/Sao_Paulo
      - key: AI_MAX_PERIOD_DAYS
        value: "366"
      - key: AI_MAX_CONTEXT_ITEMS
        value: "200"
      - key: AI_MAX_CONTEXT_STRING_CHARACTERS
        value: "4000"
      - key: AI_MAX_PROVIDER_MESSAGES
        value: "40"
      - key: AI_MAX_PROVIDER_PAYLOAD_CHARACTERS
        value: "30000"
      - key: AI_REQUESTS_PER_USER_WINDOW
        value: "20"
      - key: AI_REQUESTS_GLOBAL_WINDOW
        value: "100"
      - key: AI_RATE_WINDOW_SECONDS
        value: "60"
      - key: AI_MODEL_CALLS_PER_USER_DAY
        value: "100"
      - key: AI_MODEL_CALLS_GLOBAL_DAY
        value: "500"
      - key: AI_MODEL_TOKENS_PER_USER_DAY
        value: "100000"
      - key: AI_MODEL_TOKENS_GLOBAL_DAY
        value: "500000"
      - key: AI_AUDIT_CAPACITY
        value: "1000"
      - key: AI_TRANSIENT_RETRIES
        value: "1"
      - key: AI_REQUEST_BUDGET_MILLIS
        value: "105000"
      - key: AI_SEARCH_INTERPRETATION_TIMEOUT_MS
        value: "60000"
      - key: AI_SEARCH_INTERPRETATION_MAX_OUTPUT_TOKENS
        value: "4000"
      - key: AI_FEATURE_ORCHESTRATOR
        value: "true"
      - key: AI_FEATURE_TOOLS
        value: "true"
      - key: AI_FEATURE_SEARCH
        value: "true"
      - key: AI_FEATURE_CHARTS
        value: "false"
      - key: AI_FEATURE_WRITES
        value: "false"
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        value: docevocida12@gmail.com
      - key: APP_CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:5173,https://caderninhodigital.vercel.app,https://caderninho-digital-api.onrender.com
