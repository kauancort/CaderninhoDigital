services:
  - type: web
    name: caderninho-digital-api
    runtime: docker
    plan: free
    region: virginia
    dockerContext: ./springBoot
    dockerfilePath: ./springBoot/Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: SPRING_FLYWAY_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: docevocida12@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:5173,https://caderninhodigital.vercel.app,https://caderninho-digital-api.onrender.com
