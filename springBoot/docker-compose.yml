services:
  postgres:
    image: postgres:16-alpine
    container_name: caderninho_postgres
    restart: always
    environment:
      POSTGRES_DB: caderninho_digital
      POSTGRES_USER: caderninho_user
      POSTGRES_PASSWORD: caderninho_pass
    ports:
      - "5432:5432"
    volumes:
      - caderninho_postgres_data:/var/lib/postgresql/data
    networks:
      - caderninho_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caderninho_user -d caderninho_digital"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caderninho_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/caderninho_digital
      SPRING_DATASOURCE_USERNAME: caderninho_user
      SPRING_DATASOURCE_PASSWORD: caderninho_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: local-development-jwt-secret-change-me-123456789
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      AI_MAX_PERIOD_DAYS: ${AI_MAX_PERIOD_DAYS:-366}
      AI_MAX_CONTEXT_ITEMS: ${AI_MAX_CONTEXT_ITEMS:-200}
      AI_MAX_CONTEXT_STRING_CHARACTERS: ${AI_MAX_CONTEXT_STRING_CHARACTERS:-4000}
      AI_MAX_PROVIDER_MESSAGES: ${AI_MAX_PROVIDER_MESSAGES:-40}
      AI_MAX_PROVIDER_PAYLOAD_CHARACTERS: ${AI_MAX_PROVIDER_PAYLOAD_CHARACTERS:-30000}
      AI_FEATURE_ORCHESTRATOR: "true"
      AI_FEATURE_TOOLS: "true"
      AI_FEATURE_SEARCH: "false"
      AI_FEATURE_CHARTS: "false"
      AI_FEATURE_WRITES: "false"
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      GMAIL_SENDER: ${GMAIL_SENDER:-docevocida12@gmail.com}
    ports:
      - "8080:8080"
    networks:
      - caderninho_network

volumes:
  caderninho_postgres_data:

networks:
  caderninho_network:
    driver: bridge
