services:
  postgres:
    image: postgres:16-alpine
    container_name: caderninho_postgres
    restart: always
    environment:
      POSTGRES_DB: caderninho_digital
      POSTGRES_USER: caderninho_user
      POSTGRES_PASSWORD: caderninho_pass
    ports:
      - "5432:5432"
    volumes:
      - caderninho_postgres_data:/var/lib/postgresql/data
    networks:
      - caderninho_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caderninho_user -d caderninho_digital"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caderninho_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/caderninho_digital
      SPRING_DATASOURCE_USERNAME: caderninho_user
      SPRING_DATASOURCE_PASSWORD: caderninho_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: local-development-jwt-secret-change-me-123456789
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "8080:8080"
    networks:
      - caderninho_network

volumes:
  caderninho_postgres_data:

networks:
  caderninho_network:
    driver: bridge
