server:
  port: ${PORT:8080}

spring:
  application:
    name: CaderninhoDigital

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:caderninho_digital}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:caderninho_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:caderninho_pass}}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://caderninhodigital.vercel.app,https://caderninho-digital-api.onrender.com}
  ai:
    prompt-version: ${AI_PROMPT_VERSION:1.0}
    schema-version: ${AI_SCHEMA_VERSION:1.0}
    provider:
      key: ${OPENROUTER_API_KEY:}
      url: ${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
      model: ${OPENROUTER_MODEL:google/gemma-4-26b-a4b-it:free}
      fallback-model: ${OPENROUTER_FALLBACK_MODEL:}
    search:
      key: ${TAVILY_API_KEY:}
      url: ${TAVILY_API_URL:https://api.tavily.com/search}
      timeout-ms: ${TAVILY_TIMEOUT_MS:35000}
      interpretation-timeout-ms: ${AI_SEARCH_INTERPRETATION_TIMEOUT_MS:60000}
      interpretation-max-output-tokens: ${AI_SEARCH_INTERPRETATION_MAX_OUTPUT_TOKENS:4000}
      max-results: ${TAVILY_MAX_RESULTS:3}
      max-query-characters: ${TAVILY_MAX_QUERY_CHARACTERS:180}
      max-snippet-characters: ${TAVILY_MAX_SNIPPET_CHARACTERS:4000}
      default-city: ${AI_SEARCH_DEFAULT_CITY:Marília}
      default-state: ${AI_SEARCH_DEFAULT_STATE:SP}
    limits:
      message-characters: ${AI_MAX_MESSAGE_CHARACTERS:2000}
      history-messages: ${AI_MAX_HISTORY_MESSAGES:30}
      history-message-characters: ${AI_MAX_HISTORY_MESSAGE_CHARACTERS:4000}
      tools-per-plan: ${AI_MAX_TOOLS_PER_PLAN:2}
      tool-calls: ${AI_MAX_TOOL_CALLS:2}
      plan-repairs: ${AI_MAX_PLAN_REPAIRS:1}
      max-period-days: ${AI_MAX_PERIOD_DAYS:366}
      context-items: ${AI_MAX_CONTEXT_ITEMS:200}
      context-string-characters: ${AI_MAX_CONTEXT_STRING_CHARACTERS:4000}
      provider-messages: ${AI_MAX_PROVIDER_MESSAGES:40}
      provider-payload-characters: ${AI_MAX_PROVIDER_PAYLOAD_CHARACTERS:30000}
      max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1000}
      connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${AI_READ_TIMEOUT_MS:20000}
      request-budget-millis: ${AI_REQUEST_BUDGET_MILLIS:70000}
      requests-per-user-window: ${AI_REQUESTS_PER_USER_WINDOW:20}
      requests-global-window: ${AI_REQUESTS_GLOBAL_WINDOW:100}
      rate-window-seconds: ${AI_RATE_WINDOW_SECONDS:60}
      model-calls-per-user-day: ${AI_MODEL_CALLS_PER_USER_DAY:100}
      model-calls-global-day: ${AI_MODEL_CALLS_GLOBAL_DAY:500}
      model-tokens-per-user-day: ${AI_MODEL_TOKENS_PER_USER_DAY:100000}
      model-tokens-global-day: ${AI_MODEL_TOKENS_GLOBAL_DAY:500000}
      audit-capacity: ${AI_AUDIT_CAPACITY:1000}
      transient-retries: ${AI_TRANSIENT_RETRIES:1}
    features:
      orchestrator: ${AI_FEATURE_ORCHESTRATOR:true}
      tools: ${AI_FEATURE_TOOLS:true}
      search: ${AI_FEATURE_SEARCH:false}
      charts: ${AI_FEATURE_CHARTS:false}
      writes: ${AI_FEATURE_WRITES:false}
  gmail:
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    refresh-token: ${GMAIL_REFRESH_TOKEN:}
    sender: ${GMAIL_SENDER:docevocida12@gmail.com}
