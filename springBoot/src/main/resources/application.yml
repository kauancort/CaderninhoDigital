server:
  port: ${PORT:8080}

spring:
  application:
    name: CaderninhoDigital

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:caderninho_digital}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:caderninho_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:caderninho_pass}}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER}
    password: ${SMTP_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://caderninhodigital.vercel.app,https://caderninho-digital-api.onrender.com}
  gemini:
    key: ${GEMINI_API_KEY:}
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent}
  openrouter:
    key: ${OPENROUTER_API_KEY:}
    url: ${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
    model: ${OPENROUTER_MODEL:google/gemini-2.5-flash}
